# Applies to every cargo invocation, including Xcode and Gradle build steps
# that run outside the mise environment. Keep in sync with mise.toml.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
]
