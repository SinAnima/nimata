[package]
name = "nimata-core"
description = "Nimata domain model and local discussion logic"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
thiserror = "2.0.21"
unicode-normalization = "0.1"
uuid.workspace = true
webpki-roots = "1.0.9"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
