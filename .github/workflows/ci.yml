name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # mise provides Node and actionlint; Rust comes from rust-toolchain.toml
  # via rustup. Mobile toolchains are not needed in CI.
  MISE_DISABLE_TOOLS: rust,java,android-sdk,ruby,cocoapods,cargo:cargo-llvm-cov

jobs:
  checks:
    name: Lint, test, coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: jdx/mise-action@v5
        with:
          install_args: node actionlint

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - run: npm ci

      # The same script developers run locally (npm run verify), so the two
      # cannot drift apart.
      - name: Verify
        run: scripts/verify.sh

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
